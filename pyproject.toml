[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claim-extractor"
version = "0.1.0"
description = "Turn free-text customer claims into structured, validated data with an LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "streamlit>=1.43,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claim_extractor"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify
]

[tool.mypy]
strict = true
files = ["src", "tests", "evaluate.py", "app.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
